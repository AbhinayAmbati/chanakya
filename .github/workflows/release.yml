name: Release

# Manual, gated release pipeline. It is never triggered automatically - a
# maintainer runs it from the Actions tab and supplies the version number.
# This mirrors the project rule: nothing ships without explicit approval.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (semver, e.g. 1.0.0)
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify version matches the request
        run: |
          GRADLE_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "Gradle versionName: $GRADLE_VERSION, requested: ${{ inputs.version }}"
          if [ "$GRADLE_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::versionName ($GRADLE_VERSION) does not match the requested version (${{ inputs.version }}). Bump app/build.gradle.kts first."
            exit 1
          fi

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Run release unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Chanakya v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
